[package]
name = "cachemax"
version = "0.2.5"
edition = "2021"
description = "OpenAI-compatible prompt-cache measurement proxy: report cache reuse and its cost or speed consequence"
license = "MIT"
repository = "https://github.com/woodsonl/cachemax"

[[bin]]
name = "cachemax"
path = "src/main.rs"

[lib]
name = "cachemax"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps parsed JSON objects in document order, so a
# `serde_json::Value` round-trips the key order of the bytes we forwarded.
# The ledger's "exactly as forwarded" invariant — and later repair's
# prefix-extension of our own serialization — depend on it. Without it,
# re-serializing a parsed body (usage injection, history rewriting) would
# silently sort every object's keys.
#
# `arbitrary_precision` keeps numbers as their original text instead of
# narrowing to f64: integers beyond 2^53 survive the parse, so the drift
# classifier never aliases two different values into "equivalent" (and a
# rewritten element re-serializes with the canonical number text).
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1"
tiktoken-rs = "0.12"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# The hot path is the whole product; optimize the release binary accordingly.
# No `panic = "abort"`: a task panic should fail one request, not the proxy.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
