[package]
name = "cachemax"
version = "0.1.0"
edition = "2021"
description = "OpenAI-compatible prompt-cache measurement proxy: report cache reuse and its cost or speed consequence"
license = "MIT"
repository = "https://github.com/woodsonl/cachemax"

[[bin]]
name = "cachemax"
path = "src/main.rs"

[lib]
name = "cachemax"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-stream = "0.3"
bytes = "1"
tiktoken-rs = "0.12"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
