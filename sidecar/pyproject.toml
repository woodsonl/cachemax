[project]
name = "cachemax-sidecar"
version = "0.1.0"
description = "mlx-lm precision sidecar for the cachemax prompt-cache measurement proxy (macOS/Apple Silicon)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
# Real mlx-lm inference (macOS / Apple Silicon only). Install with:
#   uv sync --project sidecar --extra mlx
mlx = [
    "mlx-lm>=0.31.0; platform_system == 'Darwin'",
]

[project.scripts]
cachemax-sidecar = "cache_max.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cache_max"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
